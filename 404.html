<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - HackLab</title>
    <meta name="theme-color" content="#12032b" />
    <link rel="icon" type="image/png" href="images/logo.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #12032b;
        --bg-accent: #2a0d63;
        --panel: rgba(31, 14, 66, 0.78);
        --line: rgba(255, 255, 255, 0.12);
        --text: #f7f0ff;
        --muted: rgba(247, 240, 255, 0.72);
        --glow: rgba(98, 214, 255, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top right, rgba(111, 75, 255, 0.28), transparent 32%),
          radial-gradient(circle at left center, rgba(0, 201, 255, 0.16), transparent 26%),
          linear-gradient(160deg, var(--bg) 0%, #1c0840 55%, var(--bg-accent) 100%);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .shell {
        width: min(680px, 100%);
        padding: 32px;
        border-radius: 28px;
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: 0 30px 90px rgba(6, 3, 22, 0.45);
        backdrop-filter: blur(16px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 26px;
      }

      .brand img {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 0 24px var(--glow);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--muted);
        font-size: 0.82rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(2rem, 5vw, 3.4rem);
        line-height: 1.04;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.02rem;
        line-height: 1.7;
        max-width: 54ch;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 30px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 168px;
        padding: 14px 20px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--text);
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      }

      .button:hover {
        transform: translateY(-1px);
        border-color: rgba(98, 214, 255, 0.55);
      }

      .button-primary {
        background: linear-gradient(135deg, #6f4bff 0%, #5bc9ff 100%);
        color: #14082f;
        border: none;
      }

      .button-secondary {
        background: rgba(255, 255, 255, 0.05);
      }
    </style>
      <link rel="stylesheet" href="page-transitions.css">
    <script src="page-transitions.js" defer></script>
</head>
  <body>
    <main class="shell">
      <div class="brand">
        <img src="images/logo.png" alt="HackLab logo" />
        <div>
          <strong>HackLab</strong>
        </div>
      </div>
      <span class="eyebrow">404 / Route Lost</span>
      <h1>This page drifted out of the build path.</h1>
      <p>
        The link may be old, incomplete, or pointing to a page that is not published anymore.
        Jump back into the main HackLab flow and continue from the home page or student dashboard.
      </p>
      <div class="actions">
        <a class="button button-primary" href="index.html">Back to home</a>
        <a class="button button-secondary" href="auth.html">Open sign in</a>
      </div>
    </main>
  </body>
</html>
